<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig app</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/studio"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 23 16 7l9 16h-5.5L16 16.4 12.5 23z" fill="var(--accent-ink)"/></svg><span id="brand">Rig</span></a>
    <nav class="nav" aria-label="Pages">
      <div class="nav-label">Studio</div>
      <a href="#/studio" data-r="studio">Render</a>
      <a href="#/gallery" data-r="gallery">Gallery</a>
    </nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="mainwrap">
    <header class="topbar" id="topbar"></header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
