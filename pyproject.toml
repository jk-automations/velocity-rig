[project]
name = "velocity-rig"
version = "1.0.0"
description = "Camera-rig simulation for high-speed vehicle shots: ComfyUI nodes, a Comfy SDK runner and a web app. Open weights only (Z-Image Turbo, Qwen Image Edit, LTX-2.5)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "comfy-sdk>=0.5.0",
  "torch",
  "numpy",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart",
]

[project.optional-dependencies]
proxy = ["comfy-api-proxy"]

[project.scripts]
velocity-rig = "velocityrig.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["velocityrig*"]
